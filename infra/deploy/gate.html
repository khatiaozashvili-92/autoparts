<!doctype html>
<html lang="ka">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>autoparts — დემო</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1115;
        --card: #171a21;
        --text: #e8eaed;
        --muted: #9aa3b2;
        --accent: #4c8dff;
        --border: #262b36;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 32px 28px;
      }
      h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: -0.01em; }
      p { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
      label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
      input {
        width: 100%;
        padding: 11px 13px;
        font-size: 15px;
        color: var(--text);
        background: #0f1218;
        border: 1px solid var(--border);
        border-radius: 9px;
      }
      input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
      button {
        width: 100%;
        margin-top: 16px;
        padding: 11px;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 9px;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.08); }
      .note { margin: 20px 0 0; font-size: 12.5px; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>autoparts</h1>
      <p>VIN-ზე დაფუძნებული ავტონაწილების marketplace — დემო ვერსია.</p>

      <!--
        GET, not POST: nginx sets the cookie from the query argument, and
        teaching it to parse a request body would mean putting an application
        in front of the application.
      -->
      <form action="/__unlock" method="get">
        <label for="key">დემოს პაროლი</label>
        <input id="key" name="key" type="password" autocomplete="current-password" autofocus required />
        <button type="submit">შესვლა</button>
      </form>

      <p class="note">
        ეს არის სამუშაო ვერსია. SMS gateway ჯერ არ არის მიერთებული, ამიტომ
        ერთჯერადი კოდი ეკრანზე გამოჩნდება.
      </p>
    </main>
  </body>
</html>
